# ─── Prefix ──────────────────────────────────────────────────────────────────
unbind C-b
set-option -g prefix C-a

# ─── Vim Copy Mode ───────────────────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi 'v'      send -X begin-selection
bind -T copy-mode-vi 'y'      send -X copy-selection-and-cancel
bind -T copy-mode-vi 'Escape' send -X cancel
bind -T copy-mode-vi 'V'      send -X select-line
bind -T copy-mode-vi 'C-v'    send -X rectangle-toggle

# ─── General ─────────────────────────────────────────────────────────────────
set -g status-position bottom
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g status-interval 5

# ─── Keybindings ─────────────────────────────────────────────────────────────
bind-key "\\" split-window -h -c "#{pane_current_path}"
bind-key "-"  split-window -v -c "#{pane_current_path}"

unbind r
bind r {
  source-file ~/.tmux.conf
  display 'config reloaded'
}

unbind c
bind c new-window -c '#{pane_current_path}'

bind -n C-Left  previous-window
bind -n C-Right next-window

bind -n C-h select-pane -L
bind -n C-l select-pane -R
bind -n C-j select-pane -D
bind -n C-k select-pane -U

bind -r H resize-pane -L 5
bind -r L resize-pane -R 5
bind -r K resize-pane -U 5
bind -r J resize-pane -D 5

bind Left  swap-window -t :-1
bind Right swap-window -t :+1

set -g @menus_trigger 'M'

# ─── Tokyo Night Storm ───────────────────────────────────────────────────────
# bg=#1f2335  dark=#1d202f  surface=#3b4261
# fg=#c0caf5  fg_dim=#a9b1d6
# blue=#7aa2f7  cyan=#7dcfff  green=#9ece6a
# yellow=#e0af68  orange=#ff9e64  red=#f7768e  purple=#bb9af7

# ─── Pane Borders ────────────────────────────────────────────────────────────
set -g pane-border-style        "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# ─── Mode & Messages ─────────────────────────────────────────────────────────
set -g mode-style            "fg=#7aa2f7,bg=#3b4261"
set -g message-style         "fg=#c0caf5,bg=#1d202f"
set -g message-command-style "fg=#7aa2f7,bg=#1d202f"

# ─── Status Bar ──────────────────────────────────────────────────────────────
set -g status on
set -g status-justify left
set -g status-style "fg=#a9b1d6,bg=#1f2335"
set -g status-left-length  100
set -g status-right-length 100

# Left: bold session pill with powerline tail
set -g status-left \
  "#[fg=#1d202f,bg=#7aa2f7,bold]  #S #[fg=#7aa2f7,bg=#1f2335,nobold] "

# Window tabs — inactive: dim text; active: surface pill with blue text
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#a9b1d6,bg=#1f2335"
setw -g window-status-format \
  " #I  #{b:pane_current_path} #W "
setw -g window-status-current-format \
  "#[fg=#1f2335,bg=#3b4261,nobold]#[fg=#7aa2f7,bg=#3b4261,bold] #I  #{b:pane_current_path} #W #[fg=#3b4261,bg=#1f2335,nobold]"
setw -g window-status-activity-style "underscore,fg=#e0af68,bg=#1f2335"

# Right: surface segment (cpu | battery) → blue segment (time)
set -g status-right \
  "#[fg=#3b4261,bg=#1f2335]#[fg=#a9b1d6,bg=#3b4261]  #{cpu_percentage}   #{battery_icon}#{battery_percentage}  #[fg=#7aa2f7,bg=#3b4261,nobold]#[fg=#1d202f,bg=#7aa2f7,bold]  %H:%M "

# ─── Plugins ─────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'jaclu/tmux-menus'

run '~/.tmux/plugins/tpm/tpm'
